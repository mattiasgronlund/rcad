[settings]
lockfile = true

[tools]
"cargo:cargo-nextest" = "0.9"
"cargo:cargo-deny" = "0.18"
"cargo:cargo-fuzz" = "0.13"
"cargo:cargo-llvm-cov" = "0.6"
"cargo:cargo-mutants" = "25"
"cargo:just" = "1.42"
# Three hooks and three recipes parse JSON with it, and until 2026-09-20 nothing
# installed it — it passed on a runner and on this machine because both images
# happen to ship one. A container that does not is where that ran out:
# `check-hooks` reported three symptoms and no cause. A single static binary, so
# pinning it costs a download and not a build — which is the whole reason python
# is not pinned beside it. `docs/decisions.md` §173.7.
"aqua:jqlang/jq" = "1.7"
"cargo:taplo-cli" = "0.10"
# `check-lanes-workflow` builds `.claude/workflows/lanes.js` into a function to
# see that it parses; a file that reads fine as text can still not load (Q3190).
node = "26.10.0"

# **No kache here, on purpose.** kache, the build cache, is the machine's and
# not the repo's. Its compiler wrapper has to be the same release as its daemon,
# and one daemon serves every repo on the machine, so a repo that pinned its own
# kache would run its own wrapper against everybody's daemon. The machine pins
# it once, in its own mise config, beside the `RUSTC_WRAPPER` that turns it on.
# A machine without that config builds without the cache, and a runner is one.
# `just check-kache-is-the-hosts` holds it. `docs/decisions.md` §489.
