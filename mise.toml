[settings]
lockfile = true

[tools]
"cargo:cargo-nextest" = "0.9"
"cargo:cargo-deny" = "0.18"
"cargo:cargo-fuzz" = "0.13"
"cargo:just" = "1.42"
"cargo:kache" = "0.16"
"cargo:taplo-cli" = "0.10"

# `RUSTC_WRAPPER` for kache is deliberately NOT set here, and the justfile says
# why: mise's `[env]` is in force while mise installs `[tools]`, and those
# install through cargo, so the wrapper is demanded by the very cargo run that
# is installing it.
