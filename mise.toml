[settings]
lockfile = true

[tools]
"cargo:cargo-nextest" = "0.9"
"cargo:cargo-deny" = "0.18"
"cargo:cargo-fuzz" = "0.13"
"cargo:cargo-llvm-cov" = "0.6"
"cargo:cargo-mutants" = "25"
"cargo:just" = "1.42"
# Three hooks and three recipes parse JSON with it, and until 2026-09-20 nothing
# installed it — it passed on a runner and on this machine because both images
# happen to ship one. A container that does not is where that ran out:
# `check-hooks` reported three symptoms and no cause. A single static binary, so
# pinning it costs a download and not a build — which is the whole reason python
# is not pinned beside it. `docs/decisions.md` §173.7.
"aqua:jqlang/jq" = "1.7"
"cargo:kache" = "0.27"
"cargo:taplo-cli" = "0.10"

# kache is a content-addressed build cache. Cargo picks it up as a compiler
# wrapper, so a crate whose inputs have been compiled before is fetched instead
# of built.
#
# It is set here and not in `.cargo/config.toml` so that the file which sets the
# variable is the file which installs the tool. `build.rustc-wrapper` applies to
# every cargo invocation in the repo, including one made without mise, and cargo
# fails outright on a wrapper it cannot find; this way the variable exists
# exactly where `kache` does.
#
# **Off on CI, and the sentence above is why.** mise applies this `[env]` while
# it installs the `[tools]`, so on a runner cargo was asked to run `kache` in
# order to build `kache` and every tool install failed — ten pushes in a row,
# none of them reaching a check. A runner is also cold, so the wrapper there
# costs a download and saves nothing.
#
# The test is keyed on `CI` and not on `GITHUB_ACTIONS` because what makes the
# cache worthless is a machine that is thrown away, which `CI` names and
# GitHub's runners are only one instance of.
#
# The value goes empty rather than away because a template cannot produce an
# absent key, and cargo reads an empty `RUSTC_WRAPPER` as no wrapper at all —
# which is the same spelling the line below already told people to use.
# `just check-kache-off-on-ci` holds both halves.
#
# To build without the cache for a run: `RUSTC_WRAPPER= just gate`.
[env]
RUSTC_WRAPPER = '{% if get_env(name="CI", default="") == "" %}kache{% endif %}'
