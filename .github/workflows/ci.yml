# **This workflow has run and has never passed.** As of 2026-09-07 it has fired
# on ten pushes to `main`, back to 2026-09-06T20:09Z, and every one failed in
# 11–25 seconds without reaching a single check.
#
# Until this line was corrected the header opened "This workflow has never run.
# There is no remote and no CI (`git remote -v` is empty)". `origin` has been
# `https://github.com/mattiasgronlund/rcad.git` for at least a day. That
# sentence was true when written, went false without a commit, and is why a red
# CI was read for a day as an absent one — so if you change what this file does,
# change this paragraph in the same commit or leave it saying nothing.
#
# Three faults, in the order a run meets them. Only the second is fixed.
#
# **1. A rustup component race, unfixed.** mise installs the six `[tools]` at
# once, each materialises the 1.96.0 toolchain that `rust-toolchain.toml` pins,
# and they clobber one another in `~/.rustup/downloads`: "component download
# failed for clippy…", "could not rename 'downloaded' file … No such file or
# directory", the same partial hash reported by two installs concurrently.
# Candidates nobody has tested: materialise the toolchain in a step before
# `mise install`, or serialise the installs. This fires ~10 s before fault 2 and
# is untouched by it.
#
# **2. The kache wrapper deadlock, fixed 2026-09-07 in `mise.toml`.** mise
# applied `RUSTC_WRAPPER = "kache"` while installing the tool `kache`, so every
# install failed. The variable is now empty when `CI` is set; `just
# check-kache-off-on-ci` holds it, and holds the other direction too so the
# cache does not quietly go off for humans.
#
# **3. `just test` needs a STEP corpus, still open.** **Seven** test files in
# `rcad-step` read `RCAD_STEP_CORPUS` — an earlier version of this header said
# four, and so do two other places; the count is `grep -rln RCAD_STEP_CORPUS
# --include=*.rs`. They refuse to skip when it is unset, because they used to
# print "skipping" and return green, which meant a green suite had never read a
# real file (`docs/decisions.md` §45). Note the `justfile` *defaults* the
# variable, so a runner does not reach the "not set" message — it fails a line
# later on a path that does not exist.
#
# That failure is the mechanism working, not a bug to route around. The corpus
# is 375 MB of third-party files and is deliberately not in this tree, so a
# runner has to fetch or cache it, and **no fetching mechanism is built here**.
# How it should get one is an open question with Mattias, not something for a
# passing lane to decide.
#
# Note also that this runs `just test` rather than `just default`, so
# `check-enums`, `check-wildcards` and `check-wildcards-selftest` are not
# enforced here even though they gate every local run. That predates the corpus
# question and wants settling at the same time.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      - uses: Swatinem/rust-cache@v2
      - run: mise exec -- just check
      - run: mise exec -- just lint
      - run: mise exec -- just test
      - run: mise exec -- just deny
