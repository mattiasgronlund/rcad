# **CI has been green, and `34266469454` is the first green that ran the whole
# gate.** Push of `e8ae455`, 2026-09-08, 15m44s: 1811 tests run, 1811
# passed, 0 skipped — the same three numbers a local `just gate` gave on the
# same tree. Every green before it ran `just test`. Re-derive rather than
# believe it: `gh run list --repo mattiasgronlund/rcad --status success` for the
# greens, then `git show <sha>:.github/workflows/ci.yml` for what each one
# actually ran. The empty answer to that first command was the claim this header
# carried until 2026-09-07.
#
# **Getting there took three red runs, and only the first was about plugins.**
# `34260645261` asked a runner what Claude Code had been told; `34264306999` and
# `34265339769` counted colour codes instead of clippy warnings, because this
# file sets `CARGO_TERM_COLOR: always` and the recipe anchored a grep at `^`.
# `docs/decisions.md` §77 is the rule all three settled: a check can pass for a
# property of the environment it runs in rather than of the tree, and the way to
# find out is to take away what the environment supplies and run it again.
#
# **Do not write the tally here.** A count is stale on the next push, and the two
# that stood in this header both went stale within a day. Name runs instead;
# those keep. `34155345448` (2026-09-07) and `34255349804` (2026-09-08, sha
# `41b7160`) are pushes to `main` that reported **1787** and **1806 tests run,
# all passed, 0 skipped** — each the same three numbers a local `just gate`
# gave on the same tree. That agreement is the whole point of a runner: before
# it, every green here was one person running the gate locally and reporting it
# honestly.
#
# Name the commit whenever you say "CI is green", because runs are not
# interchangeable. The first success was a pull request — `origin/main` plus two
# corpus commits, containing none of the thirteen queued behind it — so it proved
# the fetch and almost nothing else. For a day "CI is green" and "the work is
# covered" were separately true and separately false.
#
# Three of this header's claims have gone false, and two of them were errors.
# It opened "This workflow has never run. There is no remote and no CI (`git
# remote -v` is empty)", which was true when written and went false without a
# commit — and its replacement said the runs "all failed in 11–25 seconds
# without reaching a single check", written on 2026-09-07 from the first page of
# `gh run list` and **false**: run `33916660058` took 11m28s, and passed `just
# check` and `just lint`. A page of ten, every row a push to `main`, could only
# return the answer it returned.
#
# The third is the design working, not a fourth mistake. "No CI run has ever
# succeeded" replaced two failure counts that had gone stale within a day, and
# was worded so that only a fix could falsify it. A fix did. Prefer a sentence
# a repair makes wrong to a number time makes wrong.
# So: if you change what this file does, change this header in the same commit,
# and re-derive anything numeric rather than copying it forward.
#
# Three faults, in the order a run meets them. All three are fixed in this file
# and all three fixes have now been watched working on a runner, which is what
# the green above is. Until `34155345448` this paragraph had to say that the
# third was still unproven; if the file changes and no run has gone green since,
# say so here rather than leaving this sentence standing.
#
# **1. A rustup component race, fixed below by `rustup show`.** mise installs
# the six `[tools]` in parallel and each one triggers rustup to materialise the
# toolchain pinned in `rust-toolchain.toml`. They race over the same `.partial`
# in `~/.rustup/downloads` and all but one die renaming it — "component download
# failed for clippy…", the same partial hash reported by two installs at once.
# Materialising the toolchain in its own step first leaves nothing to race for.
#
# **2. The kache wrapper deadlock, fixed 2026-09-07 in `mise.toml`.** mise
# applied `RUSTC_WRAPPER = "kache"` while installing the tool `kache`, so every
# install failed. The variable is now empty when `CI` is set; `just
# check-kache-off-on-ci` holds it, and holds the other direction too so the
# cache does not quietly go off for humans.
#
# Neither fix is a guess, and each has been watched separately.
#
# Together: PR #1 (`ci-kache-bootstrap`, `4f2e30e`, run `33916660058`, two days
# before either was written here) put `rustup show` in front and took the
# wrapper away. The install succeeded, `just check` and `just lint` passed, and
# `just test` ran **925 tests green** before failing on the corpus alone. That
# PR is still open. Its kache half is superseded — it deleted `RUSTC_WRAPPER`
# outright, which turns the build cache off for every human in order to fix a
# runner, where `mise.toml` now empties it only when `CI` is set.
#
# Fault 2 alone: run `34109767839`, the push that landed the `mise.toml` fix
# with no `rustup show` yet. `kache … rustc -vV` is absent from the log, and the
# tools that fail to install drop from six to **five** — `just` gets through —
# while the run reaches 1m36s instead of dying in twenty seconds. That is the
# kache fix working on a runner with fault 1 still in front of it, which is the
# one thing PR #1 could not show, having fixed both at once.
#
# **3. The tests need a STEP corpus, and it was the last fault standing.**
# Fixed and demonstrated: `34155345448` fetched one and ran 1787 tests on it.
# **Seven** test files in
# `rcad-step` read `RCAD_STEP_CORPUS` — an earlier version of this header said
# four, and so do two other places; the count is `grep -rln RCAD_STEP_CORPUS
# --include=*.rs`. They refuse to skip when it is unset, because they used to
# print "skipping" and return green, which meant a green suite had never read a
# real file (`docs/decisions.md` §45). Note the `justfile` *defaults* the
# variable, so a runner does not reach the "not set" message — it fails a line
# later on a path that does not exist.
#
# That failure is the mechanism working, not a bug to route around. The fix is
# `corpus/fetch.sh`, which rebuilds the corpus from upstream — NIST pinned by
# zip checksum, KiCad pinned by commit — and is run above behind the Actions
# cache. `corpus/sources.md` is the evidence that a fresh download is the same
# bytes; `corpus/manifest.sha256` pins all 367 files; `just check-corpus`
# compares a corpus against it and runs here on a cache hit as well as a miss.
#
# **The size figure in this header used to say 375 MB and that was misleading.**
# 375 MB is the corpus directory on disk, companion CATPart, SLDPRT, pdf and jpg
# files included. The tests open `.stp` and `.step` and nothing else, so what a
# runner needs is **367 files and 133.4 MiB**, fetched in about 119 MiB.
# Measured, not copied: `find "$RCAD_STEP_CORPUS" -type f \( -iname '*.stp' -o
# -iname '*.step' \) -printf '%s\n' | awk '{s+=$1} END {print s}'`.
#
# **This runs `just gate` — the same command a human runs.** It ran `just
# test` until 2026-09-07, which left the `check-*` recipes enforced on every
# local run and on no runner. Mattias settled that as "switch to `just gate`,
# but after the first green"; asked afterwards which green he meant, with one on
# a pull request and none yet on `main`, he answered: now.
#
# The cost of "now" is that the run landing the switch changes two things at
# once, so a red on it does not say which. What could be ruled out locally was
# ruled out: the `check-*` recipes were run in a fresh single-worktree clone with
# `CI=true` — the shape this runner has, and the shape no local gate has, since
# every worktree here sits beside a hub. `check-hub` passed there, so CLAUDE.md's
# exemption for a repository with one worktree is tested rather than assumed.
#
# **That sweep is also where this header earns its own warning.** It ran against
# seventeen `check-*` recipes and said so here. Within the hour `check-plugins`
# made it **eighteen**, in the paragraph whose whole subject is numbers going
# stale. Worse, the sweep could not have caught what the eighteenth broke: it
# ran with this machine's plugins installed, so `check-plugins`, `check-hooks`
# and `check-questions-selftest` all passed for a reason a runner does not have.
# Pointing `CLAUDE_PLUGINS_ROOT` at an empty directory is what found it — exit 1
# and two 127s. A green sweep is not evidence when the thing you are asking
# about is what the environment supplies. Do not count the recipes here again;
# `sed -n 's/^gate_steps := "//p' justfile | tr ' ' '\n' | grep -c '^check-'` is
# the number. The `sed` strips the opening quote; grepping the line whole counts
# 26, because the first step is `"check-plugins` and does not match `^check-`.
#
# One step rather than four, and `check-corpus` deliberately twice. The single
# step is what lets `check-gate-runs-every-check` reach this file: a new
# `check-*` recipe joins `gate` and is enforced here without anyone editing
# this workflow, which is the failure that recipe exists for. Splitting the four
# back out would buy prettier step names and give that up.
#
# **This job is metered, and on 2026-09-20 it stopped.** Six pushes to `main`
# produced jobs with zero steps, failing in two seconds, annotated *"The job was
# not started because recent account payments have failed or your spending limit
# needs to be increased."* Nothing in the tree was wrong; the runner never
# started. `rcad` is private and the account is on GitHub Free — 2000 minutes a
# month — and 171 runs between 2026-09-04 and 09-20 had spent **2271**.
#
# So this file now carries two cuts, and `ci-docs.yml` is the third. Neither cut
# changes what a run checks; both change which runs happen. `docs/decisions.md`
# §172 has the arithmetic and the two things that were given up.
#
# **`concurrency` below cancels a run its own branch has already superseded.**
# 68 of those 171 runs — 40% — were obsolete before they finished, a later push
# having landed inside their 13 minutes. What it costs is that a superseded
# commit never gets a green of its own, so "CI is green on `<sha>`" can now only
# be said of a tip. That is the weaker half of a rule this repo already keeps
# ("gate the tree you merged, not the one you tested"), and the tip is the tree
# that is on `main`.
#
# **`paths-ignore` sends prose to `ci-docs.yml` instead.** 43 of `main`'s last
# 150 commits touched only `docs/` and `*.md`, 42 of them `docs/decisions.md`,
# and each bought a full compile of source that had not moved. That is sound
# only because no `.md` reaches rustc here: there is no `#![doc =
# include_str!("../README.md")]` in this workspace, so no prose file is an input
# to a build. Check that before widening either list — `grep -rn 'include_str!'
# --include=*.rs crates/` — because the idiom is common and would make a
# README a compile input overnight. `just gate` makes the same claim on the
# laptop: `_code-fingerprint` leaves out these two patterns, so a commit that
# only moves prose is served the green of the code under it (`docs/decisions.md`
# §337), and `check-gate-verdicts-selftest` fails if the lists here change.
#
# A push touching prose *and* source matches neither filter's exclusion and runs
# **both** arms. That is a deliberate ~1 minute of overlap rather than a third
# filter: `paths` and `paths-ignore` cannot both be given for one event, and the
# arm that would have to guess is the expensive one.

name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The corpus lives outside the checkout on purpose: 367 fetched files
      # inside the working tree would read as untracked to everything that looks
      # at `git status`, and the corpus is deliberately not this repo's to carry.
      #
      # Set in a step rather than in the `env:` block above, because `runner` is
      # not one of the contexts a workflow-level `env` may name — only `github`,
      # `inputs` and `vars` are. Writing `${{ runner.temp }}` up there is not a
      # value that comes out empty; it makes the whole workflow file invalid, and
      # the run then fails in 0 s having never started a job.
      - run: echo "RCAD_STEP_CORPUS=$RUNNER_TEMP/rcad-step-corpus" >> "$GITHUB_ENV"
      # There is no plugin clone here any more, and the absence is the change.
      # Until 2026-09-13 this job cloned the shared marketplace at a pinned sha
      # and pointed `CLAUDE_PLUGINS_ROOT` at it, because `just gate` begins with
      # `check-plugins` and two later recipes ran scripts out of it. Asked what
      # the clone bought, each of its three users turned out to be checking
      # something this job does not have:
      #
      #   `check-plugins` asks whether Claude Code has been *told about* three
      #   plugins, and a runner has no Claude Code. The clone was creating the
      #   very directories the check then found — the job satisfying its own
      #   precondition — and the seam test after it drives `just question`
      #   against a parser no session here would load.
      #
      #   `check-hooks` tests a **PreToolUse** hook, which fires in a session.
      #   There is none in a job, so the cases ran against a hook that could not
      #   have fired either way. Its other two arms are rcad's own hooks and
      #   still run.
      #
      #   `check-questions-selftest` ran the marketplace repo's own 20 cases out
      #   of a clone made here, which tests that repo's tree rather than this
      #   one's. That repo runs them itself on every push now.
      #
      # So those recipes skip where there is no config directory and say
      # "skipped, not passed" — the predicate is that directory and never `CI`,
      # `docs/decisions.md` §77. `check-plugins` keeps its place at the head of
      # `gate` and `check-gate-runs-every-check` still pins it there, because a
      # skip is not a reason to stop asking first.
      #
      # `check-timing-hooked-calls` joins that skip list here for a different
      # reason than any of the three above: this runner has no nightly
      # toolchain, and nightly is not pinned by this repo at all (§29.9), so
      # there is nothing CI-specific about the gap — a human machine without
      # `rustup toolchain install nightly` skips it too. The recipe's own
      # predicate is "no nightly rustc, no cargo-fuzz", never `CI`, the same
      # shape as the three above.
      #
      # What is genuinely lost is this repo's three overlay patching cases in
      # `.claude/patching-cases.local.json`, which now run when a human runs the
      # gate and nowhere else. Named rather than replaced: no runner-side
      # substitute was worth a clone whose other two users checked nothing.
      #
      # The version this repo asks for lives in `.claude/settings.json`, and
      # `check-declared.sh` fails a machine registered at a different ref. That
      # is a statement about the sessions a human opens here, not about this
      # job. The version is deliberately not repeated here: this comment named
      # `v0.2.0` while the file said `v0.2.1`, and prose asserting a pin reads
      # as agreement with it right up until someone checks.
      # mise installs the `cargo:` tools in parallel, and each one triggers
      # rustup to materialise the toolchain pinned in `rust-toolchain.toml`.
      # They race over the same `.partial` file in ~/.rustup/downloads and all
      # but one die renaming it. Materialising the toolchain first leaves
      # nothing to race for.
      - run: rustup show
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      - uses: Swatinem/rust-cache@v2
      # Keyed on the manifest and the script together: change either what the
      # corpus is or how it is built, and the cached copy stops being the one
      # this commit means.
      - uses: actions/cache@v4
        id: step-corpus
        with:
          path: ${{ runner.temp }}/rcad-step-corpus
          key: step-corpus-${{ hashFiles('corpus/manifest.sha256', 'corpus/fetch.sh') }}
      - if: steps.step-corpus.outputs.cache-hit != 'true'
        run: ./corpus/fetch.sh "$RCAD_STEP_CORPUS"
      # Runs on a cache hit too, and that is the point: the fetch checks what it
      # built, but a restored cache is bytes nobody looked at this run. 0.15 s.
      #
      # `just gate` below runs this same recipe, so this step is a duplicate
      # and is kept deliberately: here it sits directly after the cache restore,
      # so a corpus that came back wrong is named in 0.15 s by the step next to
      # the cache, instead of after `just check` has spent minutes compiling.
      - run: mise exec -- just check-corpus
      # `check-corpus-selftest` needs a locale that collates by dictionary
      # order, because the collation bug it exists to catch is invisible under
      # one that collates by codepoint — and a runner's ambient `C.UTF-8` is
      # exactly that. The recipe finds such a locale by asking `sort` rather
      # than by naming one, and **refuses** when there is none rather than
      # skipping: three of its four cases stay green with the bug in place, so
      # running only those would be worse than running nothing. This step is
      # what makes sure there is one. `docs/decisions.md` §79.
      - run: |
          sudo apt-get install -y -qq locales
          sudo locale-gen en_US.UTF-8
      # One step, because the whole value of it is that it is the same command a
      # human runs. Splitting `check`/`lint`/`test`/`deny` back out would buy
      # prettier step names and cost the property that `check-gate-runs-every-
      # check` guards: a new `check-*` recipe joins `gate` and is enforced
      # here without anyone editing this file.
      - run: mise exec -- just gate
