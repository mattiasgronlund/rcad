[package]
name = "rcad-geom"
description = "Analytic geometry for the rcad kernel: points, isometries, planes, spheres, cylinders"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
# Most of tests/ is one binary, `tests/merged.rs`; a file there is declared in
# that root or given a `[[test]]` below. docs/decisions.md §373.
autotests = false

[dependencies]
nalgebra.workspace = true
rcad-predicates.workspace = true
serde.workspace = true
smallvec.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
postcard.workspace = true
proptest.workspace = true

[lints]
workspace = true

[[bench]]
name = "how_wide_the_enclosure_gets"
harness = false

[[bench]]
name = "what_a_marched_point_costs"
harness = false

[[test]]
name = "merged"
path = "tests/merged.rs"
