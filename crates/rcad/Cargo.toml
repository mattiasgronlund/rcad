[package]
name = "rcad"
description = "A tolerant B-Rep CAD kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
rcad-geom.workspace = true
rcad-mesh.workspace = true
rcad-predicates.workspace = true
# Not `.workspace = true`: rcad-step is not in the root Cargo.toml's
# [workspace.dependencies], and that file is outside this lane's ownership.
# Whoever owns it can fold this into the workspace table for consistency.
rcad-step = { path = "../rcad-step", version = "0.0.0" }
rcad-topo.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
postcard.workspace = true
proptest.workspace = true
rayon.workspace = true

[lints]
workspace = true

[[bench]]
name = "classifying_a_grid_of_points"
harness = false

# The bit-identity half of decisions.md §9.2 is a correctness check, not a
# timing, so it keeps the default harness and `test = true` — that is what makes
# the normal test run execute it.
[[bench]]
name = "the_parallel_run_matches_the_serial_one"
test = true
