[package]
name = "rcad-mesh"
description = "Triangulating a trimmed patch of surface for the rcad kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# Deliberately **not** `rcad-topo`. This crate triangulates one trimmed patch of
# one surface and knows nothing about solids; that is what gives it an oracle it
# can be tested against without building anything (decisions.md §13 rule 1), and
# what lets it be worked on beside the topology work rather than after it.
[dependencies]
rcad-geom.workspace = true
rcad-predicates.workspace = true
spade.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
