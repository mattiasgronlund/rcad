[package]
name = "rcad-step"
description = "Reads ISO 10303-21 (STEP Part 21) text into an entity graph, and its solids into a Model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
# Most of tests/ is one binary, `tests/merged.rs`; a file there is declared in
# that root or given a `[[test]]` below. docs/decisions.md §373.
autotests = false

[dependencies]
rcad-geom.workspace = true
rcad-predicates.workspace = true
rcad-topo.workspace = true
smallvec.workspace = true
thiserror.workspace = true

[dev-dependencies]
postcard.workspace = true
proptest.workspace = true
step-io = "0.2.4"

[lints]
workspace = true

[[bench]]
name = "what_the_provenance_log_costs_a_fuzz_night"
harness = false

[[test]]
name = "merged"
path = "tests/merged.rs"

# The rest stay binaries of their own, because the justfile or the record names
# each by binary, as `--test <name>`, `binary(<name>)`, `rcad-step::<name>/` in
# `slow_tests`, or an exact `test(=...)` on one of its tests, and those commands
# must still work.

[[test]]
name = "a_flat_cap_is_cut_up_the_same_after_its_own_file"

[[test]]
name = "a_fuse_read_back_from_rounded_text"

[[test]]
name = "a_real_file_written_out_and_read_back_is_the_same_solid"

[[test]]
name = "every_model_the_writer_fuzzer_kept_is_written_again"

[[test]]
name = "how_often_a_real_file_imports"

[[test]]
name = "no_cone_face_arrives_out_of_the_corpus"

[[test]]
name = "styling_is_never_among_the_shapes_walked_past"

[[test]]
name = "the_same_file_read_twice_by_two_readers"

[[test]]
name = "whether_a_tolerant_policy_buys_anything_a_certified_one_does_not"

[[test]]
name = "which_way_a_torus_faces_normal_points"
