[package]
name = "rcad-topo"
description = "Arena-backed B-Rep topology for the rcad kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
# Most of tests/ is one binary, `tests/merged.rs`; a file there is declared in
# that root or given a `[[test]]` below. docs/decisions.md §373.
autotests = false

[dependencies]
rcad-geom.workspace = true
rcad-mesh.workspace = true
rcad-predicates.workspace = true
serde.workspace = true
slotmap.workspace = true
smallvec.workspace = true
thiserror.workspace = true

[dev-dependencies]
postcard.workspace = true
proptest.workspace = true

[[test]]
name = "merged"
path = "tests/merged.rs"

# The rest stay binaries of their own, because the justfile or the record names
# each by binary, as `--test <name>`, `binary(<name>)`, `rcad-topo::<name>/` or an
# exact `test(=...)` on one of its tests, and those commands must still work.

