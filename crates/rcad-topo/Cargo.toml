[package]
name = "rcad-topo"
description = "Arena-backed B-Rep topology for the rcad kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
# Most of tests/ is one binary, `tests/merged.rs`; a file there is declared in
# that root or given a `[[test]]` below. docs/decisions.md §373.
autotests = false

[dependencies]
rcad-geom.workspace = true
rcad-mesh.workspace = true
rcad-predicates.workspace = true
serde.workspace = true
slotmap.workspace = true
smallvec.workspace = true
thiserror.workspace = true

[dev-dependencies]
postcard.workspace = true
proptest.workspace = true

[[test]]
name = "merged"
path = "tests/merged.rs"

# `what_only_a_release_build_does` stays a binary of its own: check-release-build
# builds it in release, and a release build of `merged` would rebuild every test
# in it twice for the sake of this one.

[[test]]
name = "what_only_a_release_build_does"

[lints]
workspace = true
