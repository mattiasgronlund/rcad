[package]
name = "rcad-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# Not a workspace member. `cargo-fuzz` builds this on its own with a nightly
# compiler and a sanitizer, and `rust-toolchain.toml` pins the workspace to a
# stable one — so `cargo check --workspace` must not reach in here.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
postcard = { version = "1", default-features = false, features = ["use-std"] }
rcad-geom = { path = "../crates/rcad-geom" }
rcad-predicates = { path = "../crates/rcad-predicates" }
rcad-step = { path = "../crates/rcad-step" }
rcad-topo = { path = "../crates/rcad-topo" }

[[bin]]
name = "where_two_surfaces_cross"
path = "fuzz_targets/where_two_surfaces_cross.rs"
test = false
doc = false
bench = false

[[bin]]
name = "no_step_file_makes_the_reader_panic"
path = "fuzz_targets/no_step_file_makes_the_reader_panic.rs"
test = false
doc = false
bench = false

[[bin]]
name = "no_model_makes_the_writer_panic"
path = "fuzz_targets/no_model_makes_the_writer_panic.rs"
test = false
doc = false
bench = false
