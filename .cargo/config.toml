# `inari` refuses to build on x86-64 without SSE4.2, and picks its AVX+FMA
# backend only when both are enabled. That is the backend every test runs
# against, so Haswell (2013) is the floor. See decisions.md §460.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v3"]

# Most of a test binary is debug info even with line tables only, 84% of
# `fuses_that_must_agree`, and every worktree writes its own copy of some 240
# test binaries. zlib shrinks
# `fuses_that_must_agree` from 42.7 MB to 14.0 MB, compressed before the file is
# first written. zlib and not zstd, because the standard library's backtrace
# cannot read zstd and loses its file and line. decisions §374.
[target.'cfg(target_os = "linux")']
rustflags = ["-C", "link-arg=-Wl,--compress-debug-sections=zlib"]

# Every run of the same code draws the same cases (decisions §339). A test that
# builds its runner from proptest's `Config::default()` — every `proptest!`
# block, and every `over()` in `rcad-topo`'s tests — takes its seed from this,
# and without it takes a fresh one from the operating system on every run. It is
# not forced, so a soak that sets `PROPTEST_RNG_SEED` in its own shell still
# searches from the seed it names.
[env]
PROPTEST_RNG_SEED = "0"
