[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false
repository = "https://github.com/mattiasgronlund/rcad"

[workspace.dependencies]
rcad-predicates = { path = "crates/rcad-predicates", version = "0.0.0" }
rcad-geom = { path = "crates/rcad-geom", version = "0.0.0" }
rcad-mesh = { path = "crates/rcad-mesh", version = "0.0.0" }
rcad-step = { path = "crates/rcad-step", version = "0.0.0" }
rcad-topo = { path = "crates/rcad-topo", version = "0.0.0" }

inari = { version = "=2.0.0", default-features = false }
nalgebra = "0.35"
serde = { version = "1", features = ["derive"] }
slotmap = { version = "1.1", features = ["serde"] }
smallvec = { version = "1", features = ["serde", "union"] }
thiserror = "2"

criterion = { version = "0.8", features = ["html_reports"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
proptest = "1"
rayon = "1"
robust = "1.2"
spade = { version = "2.15", default-features = false, features = ["std"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Numeric code: these fire constantly and carry no signal here.
similar_names = "allow"
many_single_char_names = "allow"

[profile.bench]
debug = true

# Full debug info more than doubled every test binary, and every worktree writes
# all of its test binaries: kache 0.27 caches a test executable, but restores it
# into each tree as a private copy, never as one file the trees share
# (docs/decisions.md §373.2). Line tables are what a backtrace needs for file and
# line; variable and type info for a debugger is `CARGO_PROFILE_DEV_DEBUG=true`
# away when wanted. `profile.test` inherits this. docs/decisions.md §203.
[profile.dev]
debug = "line-tables-only"

# One draw of the band family marches a nearly-tangent quartic loop in 18 365
# points, and unoptimised that single test is 90 of the suite's 99 seconds.
# Splitting its draws was tried and measured and buys nothing, because the cost is
# one draw and not the count. `debug-assertions` and `overflow-checks` are separate
# settings and stay on, so every `debug_assert!` the kernel checks itself with
# still fires and no test verifies less than it did.
[profile.test]
opt-level = 2
